name: Test
description: Corre la suite de pruebas unitarias con Maven

runs:
  using: composite
  steps:
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven' # <- Optimización para no descargar dependencias de cero

    - name: Correr tests
      shell: bash
      run: mvn -B test