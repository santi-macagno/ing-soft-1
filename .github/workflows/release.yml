name: CD

on:
  push:
    tags:
      - 'v*.*.*'
    # branches:
    #   - main

jobs:

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Empaquetar JAR
        run: mvn -B package -DskipTests


            - name: Configurar Java 17
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'temurin'

            - name: Compilar fuentes (acción interna)
              uses: ./.github/actions/build

            - name: Empaquetar JAR desde out/
              run: |
                set -euo pipefail
                mkdir -p target
                echo "Empaquetando clases en target/tp_design.jar"
                jar --create --file target/tp_design.jar -C out .
